name: break_first
description: Exact line breaks and paragraph heights before shaping, from a precompiled, certified per-font width model.
version: 0.3.0
repository: https://github.com/Rahiche/break-before-you-shape
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # ICU's Thai, Lao, Khmer and Burmese word dictionaries, copied byte for byte
  # from Flutter's icudtl.dat by tool/extract_dictionaries.dart (527 KB), for
  # lib/src/dictionary_break.dart.
  assets:
    - assets/dictionaries/
