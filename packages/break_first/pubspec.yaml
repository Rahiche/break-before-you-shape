name: break_first
description: "What if you could ask a Text its size before layout? Text('hi').width, .height(w), .canFit(w): exact, from a small per-font sidecar."
version: 0.3.1
repository: https://github.com/Rahiche/break-before-you-shape/tree/main/packages/break_first

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # ICU's Thai, Lao, Khmer and Burmese word dictionaries, copied byte for byte
  # from Flutter's icudtl.dat by tool/extract_dictionaries.dart (527 KB), for
  # lib/src/dictionary_break.dart.
  assets:
    - assets/dictionaries/
